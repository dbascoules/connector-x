[package]
authors = ["SFU Database System Lab <dsl.cs.sfu@gmail.com>"]
description = "Load data from databases to dataframes, the fastest way."
documentation = "https://docs.rs/connectorx"
edition = "2018"
license = "MIT"
name = "connectorx"
readme = "../README.md"
repository = "https://github.com/sfu-db/connector-x"
version = "0.4.6"

[dependencies]
anyhow = "1"
fehler = "1"
itertools = "0.14"
log = "0.4"
rayon = "1"
sqlparser = "0.37"
thiserror = "1"
url = "2"
owning_ref = "0.4"
serde_json = "1"
chrono = "0.4"

arrow = { workspace = true, optional = true }
polars = { workspace = true, optional = true, features = [
  "dtype-u8",
  "dtype-u16",
  "lazy",
] }
polars-arrow = { workspace = true, optional = true }
bb8 = { version = "0.9", optional = true }
# The TLS backend of Tiberius is chosen by `src_mssql` (native-tls) or `src_mssql_rustls` (rustls).
bb8-tiberius = { version = "0.17", default-features = false, features = ["with-tokio"], optional = true }
csv = { version = "1", optional = true }
fallible-streaming-iterator = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
gcp-bigquery-client = { version = "0.25", optional = true }
hex = { version = "0.4", optional = true }
native-tls = { version = "0.2", optional = true }
num-traits = { version = "0.2", optional = true }
openssl = { version = "0.10", optional = true, features = ["vendored"] }
oracle = { version = "0.6", optional = true }
postgres = { version = "0.19", features = [
  "with-chrono-0_4",
  "with-uuid-1",
  "with-serde_json-1",
  "with-cidr-0_2",
], optional = true }
postgres-native-tls = { version = "0.5", optional = true }
postgres-openssl = { version = "0.5", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"], optional = true }
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"], optional = true }
# Without its defaults (`flate2/zlib`, a C zlib): `src_mysql` and `src_mysql_rustls` take the other features through
# the `mysql` presets (`default`, `default-rustls`).
mysql_common = { version = "0.32", default-features = false, features = ["chrono"], optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2-oracle = { version = "0.7", features = ["chrono"], optional = true }
# `default-features = false`: the TLS backend is chosen by `src_mysql` (native-tls, the `mysql` defaults) or
# `src_mysql_rustls` (rustls, the `mysql` rustls defaults). The r2d2 manager is in `sources/mysql/pool.rs`.
mysql = { version = "25", default-features = false, optional = true }
r2d2_postgres = { version = "0.18", optional = true }
r2d2_sqlite = { version = "0.31", optional = true }
redshift-iam = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
rusqlite = { version = "0.37", features = [
  "column_decltype",
  "column_metadata",
  "chrono",
  "bundled",
], optional = true }
rust_decimal = { version = "1", features = ["db-postgres"], optional = true }
rust_decimal_macros = { version = "1", optional = true }
tiberius = { version = "0.13", default-features = false, features = [
  "tds73",
  "winauth",
  "rust_decimal",
  "chrono",
], optional = true }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "net",
], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
urlencoding = { version = "2.1", optional = true }
uuid = { version = "1", optional = true }
j4rs = { version = "0.22", optional = true }
datafusion = { version = "50.3", optional = true }
prusto = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
clickhouse = { version = "0.13", features = ["lz4"], optional = true }
cidr-02 = { version = "0.2", package = "cidr", optional = true }
pgvector = { version = "0.4", features = [
  "postgres",
  "halfvec",
], optional = true }
chrono-tz = { version = "0.10.4", optional = true }
rustc-hash = { version = "2.1.1", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
name = "connectorx"

[dev-dependencies]
criterion = "0.3"
env_logger = "0.11"
iai = "0.1"
pprof = { version = "0.14", features = ["flamegraph"] }
testcontainers = { version = "0.23", features = ["blocking"] }
ureq = { version = "2", features = ["json"] }

[features]
all = [
  "src_sqlite",
  "src_postgres",
  "src_redshift",
  "src_mysql",
  "src_mssql",
  "src_oracle",
  "src_bigquery",
  "src_csv",
  "src_dummy",
  "src_trino",
  "src_clickhouse",
  "dst_arrow",
  "dst_polars",
  "federation",
  "fed_exec",
]
branch = []
default = ["fptr"]
dst_arrow = ["arrow", "rust_decimal"]
dst_polars = ["dst_arrow", "polars", "polars-arrow"]
fptr = []
src_bigquery = ["gcp-bigquery-client", "tokio"]
src_csv = ["csv", "regex"]
src_dummy = ["num-traits"]
# `src_mssql` (TLS by native-tls, OpenSSL on Linux) and `src_mssql_rustls` (TLS by rustls) are mutually exclusive:
# Tiberius does not build with both backends.
src_mssql = ["src_mssql_common", "tiberius/native-tls"]
src_mssql_rustls = ["src_mssql_common", "tiberius/rustls"]
src_mssql_common = [
  "rust_decimal",
  "num-traits",
  "tiberius",
  "bb8-tiberius",
  "bb8",
  "tokio",
  "tokio-util",
  "uuid",
  "futures",
  "urlencoding",
]
src_mysql = ["src_mysql_common", "mysql/default"]
src_mysql_rustls = ["src_mysql_common", "mysql/default-rustls"]
src_mysql_common = ["mysql", "mysql_common", "rust_decimal", "num-traits", "r2d2"]
src_oracle = ["oracle", "r2d2-oracle", "r2d2", "urlencoding", "rust_decimal"]
# TLS by OpenSSL (`src_postgres`) or by rustls (`src_postgres_rustls`, no C library). With both, OpenSSL is used.
src_postgres = [
  "src_postgres_common",
  "native-tls",
  "openssl",
  "postgres-native-tls",
  "postgres-openssl",
]
src_postgres_rustls = ["src_postgres_common", "rustls", "tokio-postgres-rustls"]
src_postgres_common = [
  "postgres",
  "r2d2_postgres",
  "csv",
  "hex",
  "uuid",
  "rust_decimal",
  "rust_decimal_macros",
  "num-traits",
  "r2d2",
  "cidr-02",
  "pgvector",
]
# `redshift-iam://` connection strings (Redshift through IAM/PingFed). Separate from `src_postgres` because it pulls in
# the AWS SDK, which plain Postgres users do not need.
src_redshift = ["src_postgres", "redshift-iam"]
src_sqlite = [
  "rusqlite",
  "r2d2_sqlite",
  "fallible-streaming-iterator",
  "r2d2",
  "urlencoding",
  "rust_decimal",
]
src_trino = [
  "prusto",
  "uuid",
  "urlencoding",
  "rust_decimal",
  "tokio",
  "num-traits",
  "serde",
]
src_clickhouse = [
  "clickhouse",
  "tokio",
  "uuid",
  "rust_decimal",
  "serde",
  "chrono-tz",
  "regex",
  "rustc-hash",
]
federation = ["j4rs"]
fed_exec = ["datafusion", "tokio"]
# Kerberos for `trusted_connection=true` outside Windows. Links libgssapi_krb5, so it is opt-in.
integrated-auth-gssapi = ["tiberius?/integrated-auth-gssapi"]

[package.metadata.docs.rs]
features = ["all"]
